<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stefan Shirk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #ffffff;
    color: #111111;
    display: flex;
    flex-direction: column;
    justify-content: left;
    align-items: left;
    padding: 6vw;
    -webkit-user-select: none;  /* Safari */
    -moz-user-select: none;     /* old Firefox */
    -ms-user-select: none;      /* old IE/Edge */
    user-select: none;
  }


  .line {
    line-height: 1.5;
    letter-spacing: -0.02em;
    font-weight: 400;
    font-size: 1.3rem;
  }

  .plain-link {
    color: inherit;
    text-decoration: none;
  }

</style>
</head>
<body>
  <div class="line">Website still under construction!</div>
  <div class="line">Important links:</div>
  <a href="/in/" class="plain-link">
    <div class="line">- LinkedIn</div>
  </a>
  <a href="/resume.pdf" class="plain-link">
    <div class="line">- Resume</div>
  </a>
  <a href="/riemann/" class="plain-link">
    <div class="line">- Riemann prototype</div>
  </a>
</body>
</html>
