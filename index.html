<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stefan Shirk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #ffffff;
    color: #111111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 6vw;
    -webkit-user-select: none;  /* Safari */
    -moz-user-select: none;     /* old Firefox */
    -ms-user-select: none;      /* old IE/Edge */
    user-select: none;
  }

  .line {
    line-height: 1.0;
    letter-spacing: -0.02em;
  }

  .line-1 {
    font-weight: 500;
    font-size: 2rem;
  }

  .line-2 {
    font-weight: 700;
    font-size: 3rem;
    margin-top: 0.3em;
    margin-bottom: 0.3em;
  }

  .line-3 {
    font-weight: 400;
    font-size: 1.3rem;
  }

  .line-4 {
    font-weight: 600;
    font-size: 1.2rem;
    margin-top: 2em;
  }

  .line-5 {
    font-weight: 200;
    font-size: 1rem;
    color: #b6b6b6;
    margin-bottom: 2em;
  }
</style>
</head>
<body>
  <div class="line line-1">Hello!</div>
  <div class="line line-2">This website is still under construction.</div>
  <div class="line line-3">Check back in about five millenia. Error 101 or something.</div>
  <div class="line line-4">— Stefan M. Shirk</div>
  <div class="line line-5">(Em dash intentional)</div>
</body>
</html>
