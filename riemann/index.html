<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riemann Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%23343941'/%3E%3Crect x='2.5' y='2.5' width='27' height='13' rx='5.5' fill='%236b7280' opacity='.55'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-weight='700' font-size='21' fill='%23f2f5fa'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#08090a; --chassis:#1c1e21; --chassis-2:#16181a; --chassis-3:#101113;
  --rail:#24262a; --well:#0b0c0d; --well-2:#070808;
  --hi:rgba(255,255,255,.10); --hi-2:rgba(255,255,255,.24); --hi-3:rgba(255,255,255,.06);
  --lo:rgba(0,0,0,.72); --lo-2:rgba(0,0,0,.9);
  --tx:#e2e5ea; --tx-2:#a2a8b0; --tx-3:#6e747b; --tx-dim:#565b61;
  --sel:#4b8ae0; --sel-2:#2f6ac0; --sel-glow:rgba(90,160,255,.6);
  --key:#ffcc4d;
  --r:3px;
  --f:-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --fm:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:12px/1.25 var(--f);color:var(--tx);user-select:none;cursor:default;background:#000;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--well-2);box-shadow:inset 1px 1px 3px rgba(0,0,0,.85)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#41444a,#282a2e);border:1px solid #000;border-radius:5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.5)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#4d5158,#33363a)}
::-webkit-scrollbar-corner{background:var(--well-2)}

#app{height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#26282c 0%,#1c1e21 30px,#191b1e 100%);
  box-shadow:inset 0 1px 0 var(--hi-2),inset 0 0 0 1px rgba(0,0,0,.7)}

/* ================= top bar ================= */
#topbar{height:30px;flex:0 0 30px;display:flex;align-items:stretch;position:relative;z-index:820;
  background:linear-gradient(180deg,#34373d 0%,#282b30 46%,#1e2023 54%,#151719 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.6),
    0 1px 0 rgba(0,0,0,.85),0 3px 8px rgba(0,0,0,.6)}
#logo{display:flex;align-items:center;gap:7px;padding:0 10px 0 8px;flex:0 0 auto}
#logo .wm{font:600 13px/1 var(--f);letter-spacing:.075em;
  background:linear-gradient(180deg,#fff,#9aa1ac);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.7)}
.grp{display:flex;align-items:stretch;padding:3px 0;flex:0 0 auto}
.grp+.grp{margin-left:8px}
.gb{position:relative;display:flex;align-items:center;gap:5px;padding:0 9px;height:24px;
  background:linear-gradient(180deg,#42464d,#31343a 50%,#24272b);
  border:1px solid #0b0c0d;border-left-width:0;color:var(--tx);font-size:11.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.5);
  transition:background .13s ease,box-shadow .13s ease}
.gb:first-child{border-left-width:1px;border-radius:var(--r) 0 0 var(--r)}
.gb:last-child{border-radius:0 var(--r) var(--r) 0}
.gb:only-child{border-radius:var(--r)}
.gb:hover{background:linear-gradient(180deg,#4e535b,#3b3f45 50%,#2d3035);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.5),0 0 9px rgba(110,170,255,.14)}
.gb.on,.gb:active{background:linear-gradient(180deg,#14161800,#1a1c1f 0%,#26292e);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.06)}
.gb.dis{color:var(--tx-dim)}
.gb.dis .ic{opacity:.3;filter:grayscale(.9)}
.gb.dis:hover{background:linear-gradient(180deg,#42464d,#31343a 50%,#24272b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.5)}
#tbspaceL,#tbspaceR{flex:1 1 auto;min-width:6px}
/* command palette lives in the top bar */
#palwrap{flex:0 0 clamp(260px,36%,520px);display:flex;align-items:center;justify-content:center;padding:3px 0;
  position:relative;z-index:860}
#palbtn{width:100%;height:24px;display:flex;align-items:center;gap:7px;padding:0 8px;
  background:linear-gradient(180deg,#0a0b0c,#131517 55%,#191b1e);
  border:1px solid #000;border-radius:var(--r);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.09);
  color:var(--tx-3);font-size:11.5px;transition:box-shadow .16s ease,color .16s}
#palbtn:hover{color:var(--tx-2);box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.09),0 0 10px rgba(90,160,255,.2)}
#palbtn .kbd{margin-left:auto;font:10px var(--fm);color:var(--tx-dim);background:#000;border:1px solid #000;
  border-radius:2px;padding:1px 4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#palwrap.open #palbtn{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 0 0 1px var(--sel),0 0 14px var(--sel-glow)}
#palwrap.open #palbtn input{color:var(--tx)}
#palbtn input{flex:1 1 auto;height:18px;min-width:0;background:transparent;border:0;box-shadow:none;padding:0;
  font-size:11.5px;outline:none}
#paldrop{display:none;position:absolute;left:0;right:0;top:27px;max-height:min(64vh,460px);overflow:auto;
  background:linear-gradient(180deg,#22252a,#191b1e);border:1px solid #000;border-top:1px solid #2e3238;
  border-radius:0 0 4px 4px;
  box-shadow:0 26px 60px rgba(0,0,0,.85),0 0 0 1px rgba(90,160,255,.35),0 0 26px rgba(90,160,255,.14)}
#palwrap.open #paldrop{display:block}
#paldrop .it{display:flex;align-items:center;gap:8px;height:24px;padding:0 9px;font-size:11.5px;color:#c6cbd2}
#paldrop .it .k{margin-left:auto;font:9.5px var(--fm);color:var(--tx-dim)}
#paldrop .it.on{background:linear-gradient(180deg,var(--sel),var(--sel-2));color:#fff}
#paldrop .it.on .k{color:rgba(255,255,255,.75)}
#paldrop .sep{height:1px;margin:3px 6px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.07)}
#paldrop .lbl{padding:3px 9px 2px;font:9.5px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--tx-dim)}
#wbtns{display:flex;align-items:stretch;flex:0 0 auto;margin-left:8px}
.wb{width:42px;display:grid;place-items:center;border-left:1px solid rgba(0,0,0,.6);transition:background .12s}
.wb:hover{background:rgba(255,255,255,.1)}
.wb.cl:hover{background:linear-gradient(180deg,#e2493a,#b02418)}
.wb svg{opacity:.7} .wb:hover svg{opacity:1}

/* ================= ribbon ================= */
#ribbon{flex:0 0 auto;display:flex;align-items:stretch;padding:4px 7px 3px;min-height:64px;
  background:linear-gradient(180deg,#282b30,#1f2225 60%,#1a1c1f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 rgba(0,0,0,.8),0 4px 9px rgba(0,0,0,.45);
  position:relative;z-index:40;overflow:hidden}
.rgrp{display:flex;flex-direction:column;align-items:stretch;flex:0 0 auto}
.rgrp+.rgrp{margin-left:9px}
.rgrp .rgw{display:flex;align-items:stretch;flex:1 1 auto}
.rgl{flex:0 0 12px;display:flex;align-items:center;justify-content:center;font:9px var(--f);letter-spacing:.05em;
  text-transform:uppercase;color:var(--tx-dim);padding-top:2px;white-space:nowrap}
.rsep{width:1px;margin:2px 9px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.8) 18%,rgba(0,0,0,.8) 82%,transparent);
  box-shadow:1px 0 0 rgba(255,255,255,.06)}
.rb{position:relative;width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 3px;
  border:1px solid #0b0c0d;border-left-width:0;
  background:linear-gradient(180deg,#3b3f45,#2f3237 52%,#262A2E);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -1px 0 rgba(0,0,0,.45);
  transition:background .14s ease,box-shadow .14s ease;overflow:hidden}
.rb:first-child{border-left-width:1px;border-radius:var(--r) 0 0 var(--r)}
.rb:last-child{border-radius:0 var(--r) var(--r) 0}
.rb:only-child{border-radius:var(--r)}
.rb .ic{transition:transform .17s cubic-bezier(.22,.9,.28,1),filter .17s}
.rb .rl{font-size:10px;line-height:1.1;text-align:center;color:var(--tx-2);transition:color .14s}
.rb:hover{background:linear-gradient(180deg,#484d55,#3a3e44 52%,#31353a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.45)}
.rb:hover .ic{transform:translateY(-1.5px) scale(1.09)}
.rb:hover .rl{color:#f2f4f8}
.rb:active{background:linear-gradient(180deg,#1a1c1f,#26292e);box-shadow:inset 0 3px 7px rgba(0,0,0,.8)}
.rb:active .ic{transform:translateY(0) scale(.98)}
.rb.on{background:linear-gradient(180deg,#191b1e,#23262a);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.75),inset 0 0 0 1px rgba(90,160,255,.28)}
.rb.on .rl{color:#a8cdff}
.rb.dis{opacity:.4;filter:grayscale(.75)}
.rb.dis:hover{background:linear-gradient(180deg,#3b3f45,#2f3237 52%,#262A2E);box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
.rb.dis:hover .ic{transform:none}
.rb.sm{width:auto;min-width:30px;flex-direction:row;gap:4px;padding:0 7px;align-items:center}
.rzoom{display:flex;align-items:center;height:100%;padding:0 4px}
.rzoom input{width:52px;height:20px;text-align:center;font:11px var(--fm)}
#ribbon .ctx{margin-left:auto;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-end;
  padding:2px 1px 0;color:var(--tx-dim);font:10px var(--fm);letter-spacing:.04em;text-transform:uppercase;gap:2px}
#ribbon .ctx b{color:var(--tx-2);font-weight:500}

/* ================= body / docking ================= */
#body{flex:1 1 auto;display:flex;min-height:0;padding:0 4px 4px;gap:4px;position:relative}
#mid{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;gap:4px}
.zone{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
#zL,#zR{flex:0 0 auto;gap:4px} #zL{width:238px} #zR{width:286px} #zB{height:214px;flex:0 0 auto}
.gutter{flex:0 0 5px;position:relative;z-index:20}
.gutter.v{cursor:col-resize;margin:0 -4px} .gutter.h{cursor:row-resize;margin:-4px 0}
.gutter::after{content:"";position:absolute;inset:1px;border-radius:2px;background:transparent;transition:background .15s}
.gutter:hover::after{background:rgba(90,160,255,.26)}
.win{flex:1 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#232629,#1b1d20);
  border:1px solid #000;border-radius:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 3px 9px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);
  overflow:hidden;position:relative}
.win.act{box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 3px 9px rgba(0,0,0,.6),0 0 0 1px rgba(90,160,255,.34)}
.win-tb{flex:0 0 21px;display:flex;align-items:center;gap:5px;padding:0 3px 0 5px;
  background:linear-gradient(180deg,#383c42,#2a2d32 52%,#212429);
  border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 rgba(0,0,0,.5);cursor:grab}
.win.act .win-tb{background:linear-gradient(180deg,#42474f,#31353b 52%,#262a2f)}
.win-tb .nm{font-size:11px;color:#d2d6dc;flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#131518,#0f1113);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.75);overflow:hidden;position:relative}
.win-tabs{flex:0 0 19px;display:flex;align-items:stretch;padding:0 3px;
  background:linear-gradient(180deg,#232629,#1b1d20);border-top:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.win-tabs .wt{display:flex;align-items:center;padding:0 9px;font-size:10.5px;color:var(--tx-3);
  border:1px solid transparent;border-top:0;border-radius:0 0 3px 3px;transition:color .12s,background .12s}
.win-tabs .wt:hover{color:var(--tx-2)}
.win-tabs .wt.on{color:#eef0f4;background:linear-gradient(180deg,#101214,#1c1f22);border-color:#000;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.xb{width:15px;height:15px;flex:0 0 15px;display:grid;place-items:center;border-radius:2px;color:var(--tx-3);
  transition:color .13s,box-shadow .13s,background .13s}
.xb:hover{color:#ffdcd7;background:rgba(255,80,64,.16);box-shadow:0 0 9px rgba(255,80,64,.45),inset 0 0 0 1px rgba(255,80,64,.4)}
.tbtn{height:16px;min-width:16px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:2px;
  color:var(--tx-3);border:1px solid transparent;transition:all .13s;padding:0 1px}
.tbtn:hover{color:#e4e8ee;box-shadow:0 0 8px rgba(90,160,255,.34);border-color:rgba(255,255,255,.12)}
.tbtn.box{border-color:#0b0c0d;background:linear-gradient(180deg,#3c4046,#2c2f34);padding:0 2px;gap:1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}
.tbtn.box:hover{background:linear-gradient(180deg,#474c53,#34383d)}
.tbtn.press{background:linear-gradient(180deg,#0f1113,#1e2124);border-color:#000;color:#8cc2ff;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.85),0 0 7px rgba(90,160,255,.22)}
/* viewport */
#vp{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;
  background:var(--well);border:1px solid #000;border-radius:4px;
  box-shadow:inset 0 4px 12px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
#vp.act{box-shadow:inset 0 4px 12px rgba(0,0,0,.85),0 0 0 1px rgba(90,160,255,.3)}
#vpnav{flex:0 0 25px;display:flex;align-items:stretch;padding:0 0 0 3px;
  background:linear-gradient(180deg,#282b2f,#1e2124);border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 5px rgba(0,0,0,.6);overflow-x:auto;overflow-y:hidden}
#vpnav::-webkit-scrollbar{height:0}
.vtab{display:flex;align-items:center;gap:5px;padding:0 6px 0 8px;margin:3px 1px 0;height:22px;
  font-size:11px;color:var(--tx-3);border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;
  white-space:nowrap;transition:color .13s,background .13s;position:relative}
.vtab:hover{color:var(--tx)}
.vtab.on{color:#f0f2f6;background:linear-gradient(180deg,#151719,#0b0c0d);border-color:#000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 -1px 0 rgba(0,0,0,.6)}
.vtab .xb{opacity:0;width:13px;height:13px;flex:0 0 13px;transition:opacity .13s}
.vtab:hover .xb{opacity:1}
.vtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#0b0c0d}
.vtab.drag{opacity:.45}
#vpstack{flex:1 1 auto;min-height:0;position:relative}
.ed{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.ed.on{display:flex}
#vpbubble{position:absolute;right:9px;top:32px;z-index:30}
.bubble{height:20px;display:flex;align-items:center;gap:4px;padding:0 9px;border-radius:10px;
  background:linear-gradient(180deg,#3d4147,#2b2e33);border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 3px 7px rgba(0,0,0,.65);font-size:10.5px;color:var(--tx-2);
  transition:box-shadow .14s,color .14s}
.bubble:hover{color:#eef0f4;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 3px 7px rgba(0,0,0,.65),0 0 11px rgba(90,160,255,.32)}
#dropind{position:fixed;pointer-events:none;z-index:900;border-radius:4px;display:none;
  background:rgba(90,160,255,.12);border:1px solid rgba(120,180,255,.95);
  box-shadow:0 0 20px rgba(90,160,255,.6),inset 0 0 26px rgba(90,160,255,.22)}
#dragghost{position:fixed;pointer-events:none;z-index:901;display:none;padding:2px 9px;font-size:11px;
  background:linear-gradient(180deg,#3a3e44,#23262a);border:1px solid #000;border-radius:3px;
  box-shadow:0 8px 18px rgba(0,0,0,.8);color:#e2e6ec;opacity:.95}

/* ================= controls ================= */
.row{display:flex;align-items:center;min-width:0} .sp{flex:1 1 auto}
input[type=text],input[type=number],input[type=date],select,textarea,.fld{
  height:20px;padding:0 5px;background:linear-gradient(180deg,#0a0b0c,#131517);
  border:1px solid #000;border-radius:2px;color:var(--tx);font-size:11px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08);outline:none;
  transition:box-shadow .14s}
input:hover,select:hover,.fld:hover{box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.09)}
input:focus,select:focus,textarea:focus{box-shadow:inset 0 2px 4px rgba(0,0,0,.9),0 0 0 1px var(--sel),0 0 10px var(--sel-glow)}
select{-webkit-appearance:none;appearance:none;padding-right:16px;cursor:default}
.selwrap{position:relative;display:inline-flex}
.selwrap::after{content:"";position:absolute;right:5px;top:9px;pointer-events:none;
  border:3px solid transparent;border-top-color:var(--tx-3)}
textarea{height:auto;padding:4px 5px;font:11px/1.5 var(--fm);resize:none}
.btn{height:20px;padding:0 9px;display:inline-flex;align-items:center;gap:4px;justify-content:center;
  background:linear-gradient(180deg,#3d4147,#2c2f34);border:1px solid #0b0c0d;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.45);font-size:11px;
  transition:background .13s,box-shadow .13s}
.btn:hover{background:linear-gradient(180deg,#484d55,#35383e);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 8px rgba(90,160,255,.16)}
.btn:active{background:linear-gradient(180deg,#151719,#212429);box-shadow:inset 0 3px 6px rgba(0,0,0,.8)}
.btn.prim{background:linear-gradient(180deg,#4b8ae0,#2f66b4);border-color:#0d1b2e;color:#f4f8ff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 11px rgba(75,138,224,.34)}
.btn.prim:hover{background:linear-gradient(180deg,#5896ea,#3672c2)}
.btn.sm{height:17px;font-size:10px;padding:0 6px}
.sw{width:28px;height:14px;border-radius:7px;position:relative;flex:0 0 28px;
  background:linear-gradient(180deg,#050506,#141618);border:1px solid #000;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.95);transition:background .2s}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;
  background:conic-gradient(from 210deg,#82888f,#eef1f6 24%,#8e949c 47%,#f6f8fb 69%,#7c8289);
  box-shadow:0 1px 3px rgba(0,0,0,.85),inset 0 0 0 .5px rgba(255,255,255,.6);
  transition:left .19s cubic-bezier(.3,.85,.3,1)}
.sw.on{background:linear-gradient(180deg,#12341f,#248a49);box-shadow:inset 0 2px 4px rgba(0,0,0,.75),0 0 9px rgba(70,220,130,.35)}
.sw.on::after{left:15px}
.chk{width:12px;height:12px;flex:0 0 12px;border-radius:2px;background:linear-gradient(180deg,#070808,#151719);
  border:1px solid #000;box-shadow:inset 0 2px 3px rgba(0,0,0,.9);display:grid;place-items:center;color:transparent}
.chk.on{color:#9adcff;background:linear-gradient(180deg,#122b47,#1d3f66);box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 7px rgba(90,160,255,.35)}
.led{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:#181a1c;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.7)}
.led.g{background:radial-gradient(circle at 35% 30%,#d8ffe6,#3fe07a 45%,#127a3c);
  background:radial-gradient(circle at 35% 30%,#d8ffe6,#3fe07a 45%,#127a3c);box-shadow:0 0 8px rgba(70,224,130,.9),0 0 0 1px rgba(0,0,0,.7)}
.led.a{background:radial-gradient(circle at 35% 30%,#fff3d6,#ffb93f 45%,#9c5f06);box-shadow:0 0 8px rgba(255,185,63,.9),0 0 0 1px rgba(0,0,0,.7)}
.led.r{background:radial-gradient(circle at 35% 30%,#ffdad4,#ff6555 45%,#98180d);box-shadow:0 0 8px rgba(255,101,85,.9),0 0 0 1px rgba(0,0,0,.7)}
.led.b{background:radial-gradient(circle at 35% 30%,#dcefff,#57a5ff 45%,#12539f);box-shadow:0 0 8px rgba(87,165,255,.9),0 0 0 1px rgba(0,0,0,.7)}
.scroll{overflow:auto;flex:1 1 auto;min-height:0}
.hd{flex:0 0 18px;display:flex;align-items:center;gap:5px;padding:0 6px;font:10px var(--f);
  letter-spacing:.06em;text-transform:uppercase;color:var(--tx-dim);
  background:linear-gradient(180deg,#1b1d20,#151719);border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.empty{padding:12px 11px;color:var(--tx-dim);font-size:11px;line-height:1.55}
.ic{display:inline-grid;place-items:center;flex:0 0 auto;line-height:0}

/* ================= tree ================= */
.tree{padding:2px 0 8px;font-size:11.5px}
.tr{display:flex;align-items:center;gap:4px;height:18px;padding-right:6px;white-space:nowrap;position:relative}
.tr:hover{background:rgba(255,255,255,.05)}
.tr.sel{background:linear-gradient(180deg,rgba(75,138,224,.42),rgba(40,80,150,.42));
  box-shadow:inset 0 0 0 1px rgba(120,180,255,.4)}
.tr.cur{box-shadow:inset 0 0 0 1px rgba(140,195,255,.75)}
.tr.sel .lbl{color:#fff}
.tr .tw{width:11px;flex:0 0 11px;display:grid;place-items:center;color:var(--tx-3)}
.tr .tw svg{transition:transform .15s} .tr.cl .tw svg{transform:rotate(-90deg)}
.tr .lbl{overflow:hidden;text-overflow:ellipsis;color:#c9cdd3}
.tr.fold .lbl{color:#aab0b8}
.tr .tag{font:9.5px var(--fm);color:var(--tx-dim);margin-left:2px}
.tr.drop-in{box-shadow:inset 0 0 0 1px rgba(120,180,255,.9),0 0 10px rgba(90,160,255,.4)}
.tr.drop-bf::before,.tr.drop-af::after{content:"";position:absolute;left:8px;right:6px;height:2px;
  background:#6fb2ff;box-shadow:0 0 8px rgba(90,160,255,.95);border-radius:1px}
.tr.drop-bf::before{top:-1px} .tr.drop-af::after{bottom:-1px}

/* ================= properties ================= */
.pvsw{flex:0 0 24px;display:flex;align-items:center;gap:0;padding:3px 5px;
  background:linear-gradient(180deg,#1e2124,#171a1c);border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.pvb{display:flex;align-items:center;gap:4px;height:18px;padding:0 8px;font-size:10.5px;color:var(--tx-3);
  background:linear-gradient(180deg,#34383e,#26292e);border:1px solid #0b0c0d;border-left-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:all .13s}
.pvb:first-child{border-left-width:1px;border-radius:var(--r) 0 0 var(--r)}
.pvb:last-child{border-radius:0 var(--r) var(--r) 0}
.pvb:hover{color:var(--tx);background:linear-gradient(180deg,#3d4249,#2e3237)}
.pvb.on{color:#a8cdff;background:linear-gradient(180deg,#0f1113,#1d2024);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.85),inset 0 0 0 1px rgba(90,160,255,.3)}
.pvb.dis{opacity:.35}
.pcat{display:flex;align-items:center;gap:5px;height:20px;padding:0 6px;
  background:linear-gradient(180deg,#212429,#191c1f);border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid #000;font-size:10.5px;letter-spacing:.04em;color:#b6bcc4;text-transform:uppercase}
.pcat svg{transition:transform .15s} .pcat.cl svg{transform:rotate(-90deg)}
.prow{display:flex;align-items:center;min-height:22px;padding:1px 6px 1px 13px;gap:7px}
.prow:hover{background:rgba(255,255,255,.035)}
.prow .pn{flex:0 0 42%;font-size:11px;color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pv{flex:1 1 auto;display:flex;align-items:center;gap:4px;min-width:0}
.prow .pv input,.prow .pv select,.prow .pv .fld,.prow .pv .selwrap{width:100%;min-width:0}
.prow.ro .pv .fld{color:var(--tx-3);background:linear-gradient(180deg,#111315,#171a1c);font-style:italic;
  display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prow.mirror{background:rgba(90,160,255,.045)}
.jsonv{flex:1 1 auto;min-height:0;display:flex}
.jsonv textarea{flex:1 1 auto;border-radius:0;border:0;box-shadow:inset 0 3px 8px rgba(0,0,0,.8);
  background:#0a0b0c;color:#c6cbd2;font-size:11px;padding:6px 7px}
/* behavior editors */
.bh{padding:4px 6px 8px;display:flex;flex-direction:column;gap:4px}
.bh .bhr{display:flex;align-items:center;gap:4px}
.bh .bhr input{flex:1 1 auto;min-width:0}
.bh .note{font-size:10.5px;color:var(--tx-dim);line-height:1.5;padding:1px 0 3px}
.bh .card{border:1px solid #000;border-radius:3px;background:linear-gradient(180deg,#191c1f,#141618);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);padding:4px;display:flex;flex-direction:column;gap:3px}
.bh .cardh{display:flex;align-items:center;gap:5px;font:10px var(--f);letter-spacing:.05em;text-transform:uppercase;
  color:var(--tx-dim)}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:9px;font-size:10.5px;
  background:linear-gradient(180deg,#33373d,#24272b);border:1px solid #000;color:var(--tx-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

/* ================= file list ================= */
.fx{font-size:11.5px}
.fxh{display:flex;align-items:stretch;height:19px;position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,#26292d,#1d2023);border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.fxh>div{display:flex;align-items:center;padding:0 5px;font-size:10px;letter-spacing:.04em;color:var(--tx-3);
  text-transform:uppercase;border-right:1px solid rgba(0,0,0,.7);box-shadow:1px 0 0 rgba(255,255,255,.05);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxr{display:flex;align-items:stretch;height:20px}
.fxr:nth-child(even){background:rgba(255,255,255,.03)}
.fxr:hover{background:rgba(255,255,255,.07)}
.fxr.sel{background:linear-gradient(180deg,rgba(75,138,224,.4),rgba(40,80,150,.4))}
.fxr.cur{box-shadow:inset 0 0 0 1px rgba(140,195,255,.7)}
.fxr>div{display:flex;align-items:center;gap:5px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fxr .c2,.fxr .c3,.fxr .c4{color:var(--tx-3)}
.fxg{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.fxg .it{width:84px;padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-radius:3px;border:1px solid transparent;text-align:center}
.fxg .it:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.07)}
.fxg .it.sel{background:linear-gradient(180deg,rgba(75,138,224,.36),rgba(40,80,150,.36));border-color:rgba(120,180,255,.35)}
.fxg .it .n{font-size:10.5px;line-height:1.2;word-break:break-word;color:#c9cdd3}
.fxg .it .s{font-size:9.5px;color:var(--tx-dim);font-family:var(--fm)}

/* ================= node graph ================= */
.gwrap{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;cursor:default;background:#0c0d0e}
.ggrid{position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px)}
.gvig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 85% at 50% -8%,rgba(125,150,190,.14),transparent 60%),
    radial-gradient(95% 75% at 50% 110%,rgba(0,0,0,.6),transparent 62%)}
.gcv{position:absolute;inset:0}
.marq{position:absolute;pointer-events:none;border:1px solid rgba(120,180,255,.9);
  background:rgba(90,160,255,.14);box-shadow:0 0 12px rgba(90,160,255,.4);border-radius:1px}
/* design 1: full node */
.nd{position:absolute;border-radius:4px;
  background:linear-gradient(180deg,#2b2e33,#212428 55%,#1c1f22);
  border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 5px 14px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6);
  transition:box-shadow .14s}
.nd:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 5px 16px rgba(0,0,0,.75),0 0 0 1px rgba(160,195,240,.5)}
.nd.sel{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 18px rgba(0,0,0,.75),0 0 0 1.5px #86bcff,0 0 16px rgba(90,160,255,.5)}
.nd.err{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 5px 14px rgba(0,0,0,.7),0 0 0 1.5px #ff6555,0 0 14px rgba(255,101,85,.45)}
.nd-h{height:20px;display:flex;align-items:center;gap:5px;padding:0 6px;border-radius:3px 3px 0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.5);cursor:grab;overflow:hidden}
.nd-h .t{font-size:10.5px;font-weight:500;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1 1 auto}
.nd-b{padding:3px 0 4px}
.sk{height:15px;display:flex;align-items:center;position:relative}
.sk.in{padding-left:10px} .sk.out{padding-right:10px;justify-content:flex-end}
.sk .sl{font-size:10px;color:#b6bcc4;white-space:nowrap}
.sk .dot{position:absolute;width:13px;height:13px;top:1px;display:block}
.sk.in .dot{left:-7px} .sk.out .dot{right:-7px}
.sk .dot>svg{transition:filter .13s}
.sk:hover .dot>svg{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}
.nd-p{padding:1px 6px 2px;display:flex;flex-direction:column;gap:2px}
.nd-p .pr{display:flex;align-items:center;gap:5px;min-height:17px}
.nd-p .pr label{font-size:9.5px;color:#8c929a;flex:0 0 40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nd-p .pr input,.nd-p .pr select{height:16px;font-size:10px;width:100%;min-width:0}
.nd-p .pr .selwrap{flex:1 1 auto;min-width:0}
.nd-p .pr .selwrap::after{top:7px}
.nd-val{margin:2px 5px 3px;padding:2px 5px;border-radius:2px;background:rgba(0,0,0,.62);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.85);font:9.5px var(--fm);color:#7fe0a8;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nd-val.bad{color:#ff9086}
/* inline list editor */
.nd-list{margin:1px 6px 3px;display:flex;flex-direction:column;gap:2px}
.nd-list .li{display:flex;align-items:center;gap:3px}
.nd-list .li input{height:15px;font-size:10px;flex:1 1 auto;min-width:0}
.nd-list .li .xb{width:13px;height:13px;flex:0 0 13px}
.nd-add{margin:0 6px 3px;height:15px;display:flex;align-items:center;justify-content:center;gap:3px;
  border-radius:2px;border:1px dashed rgba(255,255,255,.18);font-size:9.5px;color:var(--tx-3);
  transition:all .13s}
.nd-add:hover{color:var(--tx);border-color:rgba(140,195,255,.6);background:rgba(90,160,255,.1)}
/* design 2: operator node — compact, no header */
.nd.op{border-radius:9px;min-width:0;
  background:linear-gradient(180deg,#32363c,#23262a 52%,#1b1e21);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 4px 11px rgba(0,0,0,.7)}
.nd.op .opw{display:flex;align-items:center;gap:8px;height:26px;padding:0 11px;position:relative}
.nd.op .opt{font:600 13px/1 var(--f);color:#eef1f5;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}
.nd.op .opsk{position:absolute;width:13px;height:13px}
.nd.op .opl{position:absolute;font-size:9px;color:#9aa0a8;white-space:nowrap}
.nd.op:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 13px rgba(0,0,0,.75),0 0 0 1px rgba(160,195,240,.5)}
.nd.op.sel{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.75),0 0 0 1.5px #86bcff,0 0 15px rgba(90,160,255,.5)}
/* design 3: variable pill */
.nd.pill{border-radius:11px;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.7)}
.nd.pill .pw{display:flex;align-items:center;gap:6px;height:22px;padding:0 12px;position:relative}
.nd.pill .pt{font:500 11px/1 var(--f);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.nd.pill .opsk{position:absolute;width:13px;height:13px}
.nd.pill:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 12px rgba(0,0,0,.75),0 0 0 1px rgba(200,225,255,.65)}
.nd.pill.sel{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 13px rgba(0,0,0,.75),0 0 0 1.5px #b8d8ff,0 0 15px rgba(90,160,255,.55)}
.gzoom{position:absolute;left:8px;bottom:8px;font:10px var(--fm);color:var(--tx-dim);pointer-events:none;
  padding:1px 6px;border-radius:2px;background:rgba(6,7,8,.72)}

/* ================= modal / theatre ================= */
#modals{position:fixed;inset:0;z-index:800;display:none;pointer-events:none}
#modals.on{display:block;pointer-events:auto}
#scrim{position:absolute;inset:0;background:rgba(2,3,4,.72);opacity:0;transition:opacity .22s}
#scrim.on{opacity:1}
#spot{position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:radial-gradient(58% 46% at 50% 40%,rgba(205,225,255,.16),rgba(120,150,200,.05) 45%,transparent 72%)}
#spot.on{opacity:1}
.mw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.965);opacity:0;
  transition:opacity .2s,transform .22s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(180deg,#2b2e33,#1e2125);border:1px solid #000;border-radius:5px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 70px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.6),
    0 0 80px rgba(160,195,255,.1)}
.mw.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mw-tb{flex:0 0 23px;display:flex;align-items:center;gap:5px;padding:0 4px 0 8px;
  background:linear-gradient(180deg,#3c4046,#2b2e33 52%,#232629);border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.mw-tb .nm{font-size:11px;color:#dfe3e8;flex:1 1 auto}
.mw-b{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#131518,#0e1012);box-shadow:inset 0 3px 8px rgba(0,0,0,.7)}
.mw-f{flex:0 0 32px;display:flex;align-items:center;gap:7px;padding:0 8px;
  background:linear-gradient(180deg,#23262a,#1b1d20);border-top:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
#npk{width:min(760px,88vw);height:min(500px,82vh)}
#npk .cols{flex:1 1 auto;display:flex;min-height:0}
#npk .cats{flex:0 0 186px;overflow:auto;border-right:1px solid #000;background:rgba(0,0,0,.3);padding:3px 0}
#npk .cat{display:flex;align-items:center;gap:7px;height:22px;padding:0 8px;font-size:11.5px;color:#bfc5cd}
#npk .cat:hover{background:rgba(255,255,255,.06)}
#npk .cat.on{background:linear-gradient(180deg,rgba(75,138,224,.4),rgba(40,80,150,.4));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(120,180,255,.35)}
#npk .cat .sub{padding-left:15px;font-size:11px}
#npk .list{flex:1 1 auto;overflow:auto;padding:3px 0}
#npk .it{display:flex;align-items:center;gap:8px;height:23px;padding:0 9px;font-size:11.5px}
#npk .it:hover{background:rgba(255,255,255,.06)}
#npk .it.on{background:linear-gradient(180deg,rgba(75,138,224,.42),rgba(40,80,150,.42));
  box-shadow:inset 0 0 0 1px rgba(120,180,255,.35)}
#npk .it .cn{margin-left:auto;font:9.5px var(--fm);color:var(--tx-dim)}
#npk .desc{flex:0 0 auto;padding:6px 9px;min-height:36px;border-top:1px solid #000;background:rgba(0,0,0,.3);
  font-size:11px;color:var(--tx-2);line-height:1.45}
.menu{position:fixed;z-index:850;min-width:180px;padding:3px;border-radius:4px;
  background:linear-gradient(180deg,#2c3035,#212429);border:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.85);display:none}
.menu.on{display:block}
.mi{display:flex;align-items:center;gap:8px;height:22px;padding:0 8px;border-radius:2px;font-size:11.5px;color:#cdd2d8}
.mi:hover,.mi.cur{background:linear-gradient(180deg,var(--sel),var(--sel-2));color:#fff}
.mi.dis{color:var(--tx-dim)} .mi.dis:hover{background:transparent;color:var(--tx-dim)}
.mi .k{margin-left:auto;font:9.5px var(--fm);color:var(--tx-dim)}
.mi:hover .k,.mi.cur .k{color:rgba(255,255,255,.72)}
.msep{height:1px;margin:3px 6px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.07)}

/* ================= tables ================= */
.tbl{border-collapse:separate;border-spacing:0;font:11px var(--f)}
.tbl th,.tbl td{border-right:1px solid rgba(0,0,0,.8);border-bottom:1px solid rgba(0,0,0,.65);
  padding:1px 6px;height:19px;white-space:nowrap;text-align:right;box-shadow:inset -1px 0 0 rgba(255,255,255,.035)}
.tbl th{background:linear-gradient(180deg,#282b2f,#1e2125);color:#c8ced6;font-weight:500;font-size:10.5px;
  position:sticky;top:0;z-index:2;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 3px rgba(0,0,0,.6)}
.tbl th.corner{position:sticky;left:0;z-index:3}
.tbl td{color:#c8ccd2;font-family:var(--fm);font-size:10.5px}
.tbl td.txt{text-align:left;font-family:var(--f);font-size:11px}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.028)}
.tbl tbody tr:hover td{background:rgba(90,160,255,.12)}
.tbl td.rh,.tbl th.rh{position:sticky;left:0;z-index:1;text-align:left;font-family:var(--f);font-size:11px;
  background:linear-gradient(90deg,#22252a,#1b1e21);color:#c0c6ce;
  box-shadow:1px 0 0 rgba(0,0,0,.8),inset 1px 0 0 rgba(255,255,255,.05)}
.tbl tbody tr:hover td.rh{background:linear-gradient(90deg,#2b2f36,#23272c)}
.ss-cell{outline:none;min-width:58px}
.ss-cell:focus{box-shadow:inset 0 0 0 1.5px #7fb8ff,0 0 10px rgba(90,160,255,.45);background:rgba(90,160,255,.1)}
.ss-cell.f{color:#8cc2ff}
.ss-cell.cur{box-shadow:inset 0 0 0 1.5px rgba(140,195,255,.75)}
/* viewer */
.vwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.vscroll{flex:1 1 auto;min-height:0;overflow:auto;position:relative}
.vzoom{transform-origin:0 0}
.vbar{flex:0 0 20px;display:flex;align-items:center;gap:8px;padding:0 7px;font-size:10.5px;color:var(--tx-dim);
  background:linear-gradient(180deg,#1b1d20,#151719);border-bottom:1px solid #000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.vbar b{color:var(--tx-2);font-weight:500}

/* ================= surfaces ================= */
.se{flex:1 1 auto;display:flex;min-height:0}
.se-cv{flex:1 1 auto;min-height:0;overflow:auto;display:grid;place-items:center;padding:18px;
  background:radial-gradient(140% 100% at 50% 0%,rgba(100,120,155,.1),transparent 62%),linear-gradient(180deg,#0f1113,#0a0b0c)}
.se-in{flex:0 0 220px;display:flex;flex-direction:column;min-height:0;border-left:1px solid #000;
  background:linear-gradient(180deg,#1c1f22,#17191c);box-shadow:inset 1px 0 0 rgba(255,255,255,.05)}
.pg{position:relative;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.1)}
.pg.dash{background:linear-gradient(180deg,#1e2125,#171a1d);

function mdet(m){const n=m.length;if(n===1)return m[0][0];if(n===2)return m[0][0]*m[1][1]-m[0][1]*m[1][0];
  let d=0;for(let j=0;j<n;j++)d+=((j%2)?-1:1)*m[0][j]*mdet(m.slice(1).map(r=>r.filter((_,k)=>k!==j)));return d;}
function minv(m){const n=m.length,a=m.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));
  for(let i=0;i<n;i++){let p=i;for(let k=i+1;k<n;k++)if(Math.abs(a[k][i])>Math.abs(a[p][i]))p=k;
    if(Math.abs(a[p][i])<1e-12)throw new Error('Matrix is singular');[a[i],a[p]]=[a[p],a[i]];
    const d=a[i][i];for(let j=0;j<2*n;j++)a[i][j]/=d;
    for(let k=0;k<n;k++)if(k!==i){const f=a[k][i];for(let j=0;j<2*n;j++)a[k][j]-=f*a[i][j];}}
  return a.map(r=>r.slice(n));}
function mrank(m){const a=m.map(r=>[...r]);const R=a.length,C=a[0].length;let rk=0;
  for(let c=0;c<C&&rk<R;c++){let p=-1;for(let r=rk;r<R;r++)if(Math.abs(a[r][c])>1e-10){p=r;break;}
    if(p<0)continue;[a[rk],a[p]]=[a[p],a[rk]];
    for(let r=0;r<R;r++)if(r!==rk&&Math.abs(a[r][c])>1e-12){const f=a[r][c]/a[rk][c];
      for(let j=0;j<C;j++)a[r][j]-=f*a[rk][j];}rk++;}
  return rk;}
function eigsym(m){ // Jacobi, symmetric only; falls back to 2x2 closed form
  const n=m.length;if(n===2){const[a,b]=m[0],[c,d]=m[1];const tr=a+d,dt=a*d-b*c,r=Math.sqrt(Math.max(0,tr*tr/4-dt));
    return {val:[tr/2+r,tr/2-r],vec:[[b||(a-(tr/2-r))?b:1,(tr/2+r)-a],[b,(tr/2-r)-a]]};}
  let A=m.map(r=>[...r]),Vv=A.map((_,i)=>A.map((__,j)=>i===j?1:0));
  for(let s=0;s<60;s++){let p=0,q=1,mx=0;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(Math.abs(A[i][j])>mx){mx=Math.abs(A[i][j]);p=i;q=j;}
    if(mx<1e-10)break;const th=.5*Math.atan2(2*A[p][q],A[p][p]-A[q][q]),c=Math.cos(th),si=Math.sin(th);
    for(let k=0;k<n;k++){const ap=A[k][p],aq=A[k][q];A[k][p]=c*ap+si*aq;A[k][q]=-si*ap+c*aq;}
    for(let k=0;k<n;k++){const ap=A[p][k],aq=A[q][k];A[p][k]=c*ap+si*aq;A[q][k]=-si*ap+c*aq;}
    for(let k=0;k<n;k++){const vp=Vv[k][p],vq=Vv[k][q];Vv[k][p]=c*vp+si*vq;Vv[k][q]=-si*vp+c*vq;}}
  return {val:A.map((r,i)=>r[i]),vec:Vv};}

  if(isT(v,'Sheet')){const r=v.rows;if(!r.length)return V.table([],[]);
    return V.table(r[0].map((c,i)=>String(c===''?colLabel(i):c)),r.slice(1));}
  if(isT(v,'Grid')){const r=v.v;if(!r.length)return V.table([],[]);
    return V.table(r[0].map((c,i)=>String(c===''?colLabel(i):c)),r.slice(1));}
  if(isT(v,'List'))return V.table(['Value'],v.v.map(x=>[x]));
  if(isT(v,'Dict'))return V.table(['Key','Value'],Object.keys(v.v).map(k=>[k,v.v[k]]));

  ev(n,i){const sh=isT(i.Spreadsheet,'Sheet')?i.Spreadsheet.rows.map(r=>r.slice()):[[]];
    const r0=Math.max(0,Math.round(num(n.params.row))-1);

function csvParse(txt){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else if(c!=='\r')cur+=c;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function csvToTable(txt){
  const r=csvParse(txt);if(!r.length)return V.table([],[]);

  const rows=r.slice(1).map(x=>x.map(v=>{const t=String(v).trim();const f=parseFloat(t);
    return t!==''&&!isNaN(f)&&/^-?[\d.]+$/.test(t)?f:t;}));
  return V.table(cols,rows);
}
function tableToCsv(tb){
  const q=v=>{const s=v==null?'':(v instanceof Date?fmtDate(v):String(v));return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const head=tb.cols.some(c=>c.g)?[tb.cols.map(c=>q(c.g||'')).join(','),tb.cols.map(c=>q(c.n)).join(',')]
    :[tb.cols.map(c=>q(c.n)).join(',')];
  return head.concat(tb.rows.map(r=>r.map(q).join(','))).join('\n');
}

function varValue(v){
  switch(v.type){
    case 'Date':return new Date(String(v.value)+'T00:00:00');
    case 'Int':return Math.round(num(v.value));
    case 'Float':return num(v.value);
    case 'Bool':return !!v.value;
    case 'Dict':return V.dict(typeof v.value==='object'&&v.value?v.value:{});
    case 'List':return V.list(Array.isArray(v.value)?v.value:String(v.value||'').split(',').map(s=>{const f=parseFloat(s);return isNaN(f)?s.trim():f;}));
    case 'Enum':return String(v.value);
    default:return v.value;
  }
}
function readConn(c,mode){
  const txt=c.data||'';const tb=csvToTable(txt);
  if(mode==='Grid')return V.grid([tcolNames(tb)].concat(tb.rows));
  if(mode==='List')return V.list(tb.rows.map(r=>r[0]));
  return tb;
}
let EVALFORCE=false;
const RTKEEP={vals:{},errs:{},outs:{}};
function evaluate(){
  const prev=RT;
  RT={vals:{},errs:{},outs:{}};
  FILE.graphs.forEach(g=>{
    if(g.auto===false&&!EVALFORCE){
      RT.vals[g.name]=(prev&&prev.vals&&prev.vals[g.name])||{};
      RT.errs[g.name]=(prev&&prev.errs&&prev.errs[g.name])||{};
      if(prev&&prev.outs)(g.nodes||[]).forEach(n=>{if(nodeDef(n).id==='ToOutputs'){
        const nm=sanitizeName(n.params.name||'');
        if(nm&&prev.outs[nm]!==undefined)RT.outs[nm]=prev.outs[nm];}});
      return;}
    const vals={},errs={};RT.vals[g.name]=vals;RT.errs[g.name]=errs;
    const byName={};g.nodes.forEach(n=>byName[n.name]=n);
    const inEdge=(nn,sk)=>g.edges.find(e=>e.to[0]===nn&&e.to[1]===sk);
    const state={};
    const cx={file:FILE,graph:g,varValue,readConn,emit(name,v){RT.outs[sanitizeName(name)]=v;}};
    function get(nn,depth){
      if(depth>200)throw new Error('Cycle detected at '+nn);
      if(state[nn]==='done')return vals[nn];
      if(state[nn]==='busy')throw new Error('Cycle detected at '+nn);
      state[nn]='busy';
      const n=byName[nn];const d=nodeDef(n);const ins={};
      try{
        nodeIns(n).forEach(([sk])=>{const e=inEdge(nn,sk);
          if(e){const src=get(e.from[0],depth+1);ins[sk]=src?src[e.from[1]]:undefined;}
          else ins[sk]=undefined;});
        let nx=n;
        const pk=Object.keys(n.params||{});
        if(pk.some(k=>typeof n.params[k]==='string'&&n.params[k][0]==='=')){
          const p2=Object.assign({},n.params);const sco={};
          FILE.globals.forEach(v=>sco[v.name]=varValue(v));
          (g.locals||[]).forEach(v=>sco[v.name]=varValue(v));
          Object.assign(sco,ins);
          pk.forEach(k=>{if(typeof p2[k]==='string'&&p2[k][0]==='='){
            try{p2[k]=evalExpr(p2[k].slice(1),sco,cx);}catch(err){}}});
          nx=Object.assign({},n,{params:p2});
        }
        const r=d.ev?d.ev(nx,ins,cx):null;
        const outs=nodeOuts(n);const o={};
        if(outs.length>1&&r&&typeof r==='object'&&r.__t===undefined)outs.forEach(([k])=>o[k]=r[k]);
        else outs.forEach(([k])=>o[k]=r);
        vals[nn]=o;state[nn]='done';return o;
      }catch(e){errs[nn]=e.message;vals[nn]={};state[nn]='done';return {};}
    }
    g.nodes.forEach(n=>{try{get(n.name,0);}catch(e){errs[n.name]=e.message;}});
  });
  return RT;
}

function paneCell(id){for(const z in UI.zones)for(const c of UI.zones[z])if(c.p.includes(id))return {z,c};
  const t=UI.tabs.find(t=>t.kind==='pane'&&t.pane===id);return t?{z:'C'}:null;}

  for(const z in UI.zones){UI.zones[z].forEach(c=>{const i=c.p.indexOf(id);
    if(i>=0){c.p.splice(i,1);c.a=clamp(c.a,0,Math.max(0,c.p.length-1));}});
    UI.zones[z]=UI.zones[z].filter(c=>c.p.length);}

function rect(e){const r=e.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height};}
function hitTarget(x,y){
  const bodyR=rect($('#body'));
  if(x<bodyR.x||x>bodyR.x+bodyR.w||y<bodyR.y||y>bodyR.y+bodyR.h)return null;
  for(const z of ['L','R','B']){
    const cells=UI.zones[z],box=$('#z'+z);
    if(!cells.length)continue;
    for(let ci=0;ci<cells.length;ci++){
      const w=box.children[ci*2];if(!w)continue;const r=rect(w);
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
        const horiz=(z==='B'),f=horiz?(x-r.x)/r.w:(y-r.y)/r.h;
        if(f<.28)return {z,ci,mode:'before',r:horiz?{x:r.x,y:r.y,w:r.w/2,h:r.h}:{x:r.x,y:r.y,w:r.w,h:r.h/2}};
        if(f>.72)return {z,ci,mode:'after',r:horiz?{x:r.x+r.w/2,y:r.y,w:r.w/2,h:r.h}:{x:r.x,y:r.y+r.h/2,w:r.w,h:r.h/2}};
        return {z,ci,mode:'tab',r};
      }}
  }
  const vr=rect($('#vp'));
  if(x>=vr.x&&x<=vr.x+vr.w&&y>=vr.y&&y<=vr.y+vr.h){
    const edge=28;
    if(x-vr.x<edge)return {z:'L',ci:0,mode:UI.zones.L.length?'before':'tab',r:{x:vr.x,y:vr.y,w:UI.sizes.L,h:vr.h}};
    if(vr.x+vr.w-x<edge)return {z:'R',ci:0,mode:UI.zones.R.length?'before':'tab',r:{x:vr.x+vr.w-UI.sizes.R,y:vr.y,w:UI.sizes.R,h:vr.h}};

    return {z:'C',r:vr};

}

/* tree drag: reorder + reparent */
function startTreeDrag(e,dk,tree){
  const sx=e.clientX,sy=e.clientY;let go=false,drop=null;
  const clear=()=>$$('.tr',tree).forEach(r=>r.classList.remove('drop-in','drop-bf','drop-af'));
  const mv=ev=>{
    if(!go){if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<5)return;go=true;
      const g=$('#dragghost');g.style.display='block';g.textContent=displayName(dk.name);}
    const g=$('#dragghost');g.style.left=(ev.clientX+10)+'px';g.style.top=(ev.clientY+8)+'px';
    clear();drop=null;
    const r=document.elementFromPoint(ev.clientX,ev.clientY);const row=r&&r.closest('.tr');
    if(!row)return;
    const tgt=row.dataset.dk?JSON.parse(row.dataset.dk):null;
    const sel=row.dataset.sel?JSON.parse(row.dataset.sel):null;
    const rc=row.getBoundingClientRect();const f=(ev.clientY-rc.top)/rc.height;
    if(tgt&&tgt.t===dk.t&&!(tgt.name===dk.name&&tgt.graph===dk.graph)){
      const mode=f<.5?'bf':'af';row.classList.add('drop-'+mode);drop={mode,tgt};}
    else if(sel&&sel.kind==='folder'&&dk.t==='var'){
      const okG=sel.id==='globals', okL=String(sel.id).startsWith('locals:');
      if(okG||okL){row.classList.add('drop-in');drop={mode:'in',folder:sel.id};}}
  };
  const up=()=>{
    removeEventListener('mousemove',mv);removeEventListener('mouseup',up);
    $('#dragghost').style.display='none';clear();
    if(go&&drop)applyTreeDrop(dk,drop);
  };
  addEventListener('mousemove',mv);addEventListener('mouseup',up);
}
function varList(scope,graph){return scope==='Global'?FILE.globals:findGraph(graph).locals;}
function applyTreeDrop(dk,drop){
  commit('reorder');
  if(dk.t==='graph'){
    const i=FILE.graphs.findIndex(g=>g.name===dk.name);const it=FILE.graphs.splice(i,1)[0];
    let j=FILE.graphs.findIndex(g=>g.name===drop.tgt.name);if(drop.mode==='af')j++;
    FILE.graphs.splice(j,0,it);
  }else if(dk.t==='node'){
    if(drop.tgt&&drop.tgt.graph!==dk.graph)return render();
    const g=findGraph(dk.graph);const i=g.nodes.findIndex(n=>n.name===dk.name);const it=g.nodes.splice(i,1)[0];
    let j=g.nodes.findIndex(n=>n.name===drop.tgt.name);if(drop.mode==='af')j++;
    g.nodes.splice(j,0,it);
  }else if(dk.t==='var'){
    const src=varList(dk.scope,dk.graph);const i=src.findIndex(v=>v.name===dk.name);if(i<0)return;
    let dstScope,dstGraph,j;
    if(drop.mode==='in'){dstScope=drop.folder==='globals'?'Global':'Local';dstGraph=drop.folder==='globals'?null:drop.folder.slice(7);j=-1;}
    else{dstScope=drop.tgt.scope;dstGraph=drop.tgt.graph;}
    const dst=varList(dstScope,dstGraph);
    const it=src.splice(i,1)[0];
    if(dst!==src&&dst.some(v=>v.name===it.name))it.name=uniqueName(it.name,dst.map(v=>v.name));
    if(j===-1)dst.push(it);
    else{let k=dst.findIndex(v=>v.name===drop.tgt.name);if(drop.mode==='af')k++;dst.splice(k,0,it);}
    if(UI.sel&&UI.sel.kind==='var'&&UI.sel.name===it.name)UI.sel={kind:'var',scope:dstScope,graph:dstGraph,name:it.name};
  }
  evaluate();render();
}

  if(s.kind==='var'){const l=varList(s.scope,s.graph);return {t:'Variable',o:l.find(v=>v.name===s.name)};}

function bindSockets(host,n){

      n.xins[i].n=nn;

      if(g)g.edges.forEach(ed=>{if(ed.to[0]===n.name&&ed.to[1]===old)ed.to[1]=nn;});}

  on(host,'click','[data-sk-del]',(e,t)=>{const i=+t.dataset.skDel;commit('remove socket');

function describe(v){
  if(v==null)return '—';
  if(isT(v,'Table'))return v.rows.length+' entries × '+v.cols.length+' fields';
  if(isT(v,'Sheet'))return v.rows.length+' × '+(v.rows[0]?v.rows[0].length:0)+' cells';
  if(isT(v,'Grid'))return v.v.length+' × '+(v.v[0]?v.v[0].length:0);
  if(isT(v,'List'))return v.v.length+' items';
  if(isT(v,'Dict'))return Object.keys(v.v).length+' pairs';
  if(isT(v,'Set'))return ((v.iv&&v.iv.length?v.iv.length+' interval(s)':'')+((v.pts&&v.pts.length)?(v.iv&&v.iv.length?', ':'')+v.pts.length+' point(s)':''))||'empty';
  if(isT(v,'Doc'))return 'Document · '+(v.pages&&v.pages.length>1?v.pages.length+' pages':(v.spec.paper||'')+' '+(v.spec.orientation||''));
  if(isT(v,'Dash'))return 'Dashboard · '+(v.spec.aspect||'');
  if(isT(v,'Chart'))return v.kind+' chart';
  if(isT(v,'DateDelta')){const p=[];if(v.years)p.push(v.years+' y');if(v.months)p.push(v.months+' mo');
    if(v.days||!p.length)p.push((v.days||0)+' d');return p.join(' ');}
  if(isT(v,'TimeDelta')){const p=[];if(v.hours)p.push(v.hours+' h');if(v.minutes)p.push(v.minutes+' min');
    if(v.seconds||!p.length)p.push((v.seconds||0)+' s');return p.join(' ');}
  if(v instanceof Date)return fmtDate(v);
  if(typeof v==='number')return fmtNum(v);
  if(typeof v==='boolean')return v?'True':'False';
  return String(v);
}
function applyProp(so,k,val){
  commit('edit property');
  const o=so.o;
  if(k==='__name'&&so.t==='Node'){
    if(isVarNode(nodeDef(o))){toast('This node takes its name from its variable.');return;}
    o.label=uniqueLabel(so.g,String(val).trim()||o.label);
    UI.tabs.forEach(t=>{if(t.node===o.name&&t.graph===so.g.name)t.title=o.label;});
    evaluate();render();return;}
  if(k==='__name'){
    const taken=so.t==='Node'?so.g.nodes.filter(n=>n!==o).map(n=>n.name):
      so.t==='NodeGraph'?FILE.graphs.filter(g=>g!==o).map(g=>g.name):
      so.t==='Variable'?varList(UI.sel.scope,UI.sel.graph).filter(v=>v!==o).map(v=>v.name):
      so.t==='FileConnection'?FILE.imports.filter(c=>c!==o).map(c=>c.name):[];
    const nn=uniqueName(val,taken);const old=o.name;o.name=nn;
    if(so.t==='Node'){so.g.edges.forEach(e=>{if(e.from[0]===old)e.from[0]=nn;if(e.to[0]===old)e.to[0]=nn;});
      UI.sel={kind:'node',graph:so.g.name,node:nn};
      UI.tabs.forEach(t=>{if(t.node===old&&t.graph===so.g.name){t.node=nn;t.title=displayName(nn);}});}
    if(so.t==='NodeGraph'){UI.sel={kind:'graph',graph:nn};UI.tabs.forEach(t=>{if(t.graph===old){t.graph=nn;if(t.kind==='graph')t.title=displayName(nn);}});}
    if(so.t==='Variable'){UI.sel=Object.assign({},UI.sel,{name:nn});
      FILE.graphs.forEach(g=>g.nodes.forEach(n=>{if(n.params&&n.params.variable===old)n.params.variable=nn;}));}
    if(so.t==='FileConnection')FILE.graphs.forEach(g=>g.nodes.forEach(n=>{if(n.params&&n.params.connection===old)n.params.connection=nn;}));
    dropEditors();
  }
  else if(k==='__vtype'){o.type=val;o.value=val==='Bool'?false:val==='Date'?'2026-06-30':val==='Dict'?{}:val==='List'?[]:
    val==='Enum'?(o.opts&&o.opts[0])||'A':val==='String'?'':0;
    if(val==='Enum'&&!o.opts)o.opts=['A','B'];}
  else if(k==='__scope'){
    const s=UI.sel;if(val===s.scope)return;
    const src=varList(s.scope,s.graph);const i=src.findIndex(v=>v===o);
    let gname=s.graph||(FILE.graphs[0]&&FILE.graphs[0].name);
    if(val==='Local'&&!gname){toast('There are no node graphs to hold a local variable.');return;}
    const dst=val==='Global'?FILE.globals:findGraph(gname).locals;
    src.splice(i,1);o.name=uniqueName(o.name,dst.map(v=>v.name));dst.push(o);
    UI.sel={kind:'var',scope:val,graph:val==='Local'?gname:null,name:o.name};
  }
  else if(k==='__opts'){o.opts=String(val).split(',').map(x=>x.trim()).filter(Boolean);if(!o.opts.includes(o.value))o.value=o.opts[0]||'';}
  else if(k==='__x')o.x=Math.round(num(val));
  else if(k==='__y')o.y=Math.round(num(val));
  else if(k.startsWith('p_')){const pk=k.slice(2);const d=nodeDef(o);const p=(d.params||[]).find(q=>q.k===pk);
    o.params[pk]=p&&p.t==='bool'?!!val:(p&&p.t==='num'?num(val):val);}
  else if(k==='value'){
    if(o.type==='Bool')o.value=!!val;
    else if(o.type==='Int')o.value=Math.round(num(val));
    else if(o.type==='Float')o.value=num(val);
    else if(o.type==='Dict'||o.type==='List'||o.type==='Grid'){try{o.value=JSON.parse(val);}catch(e){o.value=val;}}
    else o.value=val;
  }
  else o[k]=val;
  evaluate();render();
}
function paramCtl(n,p,pfx){
  const v=n.params[p.k];const k=(pfx||'')+p.k;
  if(p.t==='bool')return pSw(k,v);
  if(p.t==='select')return pSel(k,v,p.opts||[]);
  if(p.t==='num')return pIn(k,v,'text');
  if(p.t==='date')return pIn(k,v,'date');
  if(p.t==='area')return `<input type="text" data-p="${k}" value="${esc(String(v||'').replace(/\n/g,' | '))}" title="Use the Behavior view for multi-line entry">`;
  if(p.t==='conn')return pSel(k,v,[''].concat(FILE.imports.map(c=>c.name)));
  if(p.t==='gvar')return pSel(k,v,[''].concat(FILE.globals.map(x=>x.name)));
  if(p.t==='lvar'){const g=FILE.graphs.find(g=>g.nodes.includes(n));return pSel(k,v,[''].concat(g?g.locals.map(x=>x.name):[]));}
  if(p.t==='col'){const g=FILE.graphs.find(g=>g.nodes.includes(n));const cols=upstreamCols(g,n);
    return cols.length?pSel(k,v,[''].concat(cols)):pIn(k,v);}
  return pIn(k,v);
}
function upstreamCols(g,n){

    const v=(RT.vals[g.name]||{})[e.from[0]];const t=v&&v[e.from[1]];
    if(isT(t,'Table'))tcolNames(t).forEach(c=>{if(!out.includes(c))out.push(c);});});
  return out;
}

    gr.style.display=UI.gridOn?'block':'none';mm.style.display=UI.mmOn?'block':'none';
    const u=20*V0.z,b2=u*5;
    gr.style.backgroundSize=`${u}px ${u}px,${u}px ${u}px,${b2}px ${b2}px,${b2}px ${b2}px`;
    gr.style.backgroundPosition=`${V0.x}px ${V0.y}px,${V0.x}px ${V0.y}px,${V0.x}px ${V0.y}px,${V0.x}px ${V0.y}px`;
  }
  /* ---------- three node designs ---------- */
  function skHtml(dir,nm,k,ty,cls){
    return `<span class="${cls||'dot'}" data-sk="${dir}:${esc(nm)}:${esc(k)}:${esc(ty)}">${socket(ty)}</span>`;
  }
  function ndHtml(n){
    const d=nodeDef(n),c=CATS[d.cat],ins=nodeIns(n),outs=nodeOuts(n);
    const vals=(RT.vals[g.name]||{})[n.name]||{},err=(RT.errs[g.name]||{})[n.name];
    const sel=isSel(n.name)?' sel':'';
    const head=`data-nd="${esc(n.name)}" style="left:${n.x}px;top:${n.y}px"`;
    if(d.design==='pill'){
      const vt=varTypeOf(n),col=PRIMC[vt]||PRIMC.Any;
      const isGet=/^Get/.test(d.id);
      const rows=Math.max(ins.length,outs.length);
      const H=Math.max(22,rows*15+7);
      const w=Math.max(74,String(displayName(n.params.variable||d.label)).length*6.4+40);
      return `<div class="nd pill${sel}${err?' err':''}" ${head.replace('style="','style="min-width:'+w+'px;')}
        ><div class="pw" style="height:${H}px;background:linear-gradient(180deg,${mix(col,'#ffffff',.28)},${mix(col,'#000000',.45)});
          border-radius:11px;padding:0 ${ins.length?15:12}px 0 ${ins.length?15:12}px">
        <span class="pt">${esc(nodeLabel(n))}</span>
        ${ins.map((x,i)=>skHtml('in',n.name,x[0],vt==='Any'?x[1]:vt,'opsk')+
          `<span class="opsk-fix"></span>`).join('')}
        ${outs.map((x,i)=>skHtml('out',n.name,x[0],vt==='Any'?x[1]:vt,'opsk')).join('')}
        </div></div>`;
    }
    if(d.design==='op'){
      const rows=Math.max(ins.length,outs.length,1);
      const H=Math.max(26,rows*15+9);
      const showL=ins.length>1||outs.length>1;
      const wl=showL?Math.max(0,...ins.map(x=>x[0].length))*5.2+12:6;
      const wr=showL?Math.max(0,...outs.map(x=>x[0].length))*5.2+12:6;
      const title=d.sym||d.label;
      const wm=(d.sym?20:title.length*6.6)+18;
      return `<div class="nd op${sel}${err?' err':''}" ${head}
        ><div class="opw" style="height:${H}px;padding-left:${wl+8}px;padding-right:${wr+8}px;min-width:${wl+wr+wm}px">
        <span class="opt"${d.sym?' style="font-size:15px"':''}>${esc(title)}</span>
        ${ins.map((x,i)=>skHtml('in',n.name,x[0],x[1],'opsk')).join('')}
        ${outs.map((x,i)=>skHtml('out',n.name,x[0],x[1],'opsk')).join('')}
        ${showL?ins.map(x=>`<span class="opl in">${esc(x[0])}</span>`).join('')+
          outs.map(x=>`<span class="opl out">${esc(x[0])}</span>`).join(''):''}
        </div></div>`;
    }
    if(d.design==='note'){
      return `<div class="nd${sel}" ${head.replace('style="','style="min-width:172px;background:linear-gradient(180deg,#2a2d31,#1f2225);')}
        ><div class="nd-h" style="background:linear-gradient(180deg,#4a4f57,#343841)">${ico('braces',12)}<span class="t">${esc(displayName(n.name))}</span></div>
        <div style="padding:4px 7px;font-size:10.5px;color:#aeb4bc;white-space:pre-wrap;max-width:240px">${esc(n.params.text||'Double-click Behavior to write a note.')}</div></div>`;
    }
    const ps=visParams(d);
    const outv=outs.length?vals[outs[0][0]]:null;
    const w=ps.length?178:d.editor?154:138;
    return `<div class="nd${sel}${err?' err':''}" ${head.replace('style="','style="min-width:'+w+'px;')}>
      <div class="nd-h" data-ndh="${esc(n.name)}" style="background:linear-gradient(180deg,${c.c},${c.c2})">
        ${ico(nodeIco(n),13)}<span class="t">${esc(nodeLabel(n))}</span></div>
      <div class="nd-b">
        ${outs.map(([k,ty])=>`<div class="sk out"><span class="sl">${esc(k)}</span>${skHtml('out',n.name,k,ty)}</div>`).join('')}
        ${ps.length?`<div class="nd-p">${ps.map(p=>`<div class="pr"><label title="${esc(p.label)}">${esc(p.label)}</label>${paramCtl(n,p,'g_')}</div>`).join('')}</div>`:''}
        ${d.items?`<div class="nd-list">${(n.items||[]).map((it,i)=>`<div class="li">
            <input type="text" data-nit="${i}" value="${esc(it)}">
            <span class="xb" data-nitd="${i}"><svg width="8" height="8" viewBox="0 0 24 24">${IC.x}</svg></span></div>`).join('')}</div>
          <div class="nd-add" data-nitadd="1">${ico('plus',10)}Add item</div>`:''}
        ${ins.map(([k,ty])=>`<div class="sk in">${skHtml('in',n.name,k,ty)}<span class="sl">${esc(k)}</span></div>`).join('')}
        ${d.dynSock?`<div class="nd-add" data-skadd="1">${ico('plus',10)}Add socket</div>`:''}
        ${(outs.length||err)?`<div class="nd-val${err?' bad':''}" title="${esc(err||describe(outv))}">${esc(err?'! '+err:describe(outv))}</div>`:''}
      </div></div>`;
  }
  /* ---------- geometry from the offset chain: exact, zoom independent ---------- */
  function measure(){
    geo={};
    $$('.nd',cv).forEach(e=>{
      const nm=e.dataset.nd;const o={w:e.offsetWidth,h:e.offsetHeight,in:{},out:{}};
      $$('[data-sk]',e).forEach(sk=>{
        const p=sk.dataset.sk.split(':');let x=0,y=0,el2=sk;
        while(el2&&el2!==e){x+=el2.offsetLeft;y+=el2.offsetTop;el2=el2.offsetParent;}
        o[p[0]][p[2]]={x:x+sk.offsetWidth/2,y:y+sk.offsetHeight/2};});
      geo[nm]=o;});
    measured=$$('.nd',cv).length===0||wrap.offsetWidth>0;
  }
  function paint(){
    cv.innerHTML=g.nodes.map(ndHtml).join('');
    fixOpLabels();
    measure();
    wires();minimap();
    if(!measured)requestAnimationFrame(()=>{measure();wires();minimap();});
  }
  function fixOpLabels(){
    $$('.nd.op',cv).forEach(e=>{
      const ins=$$('.opsk[data-sk^="in:"]',e),outs=$$('.opsk[data-sk^="out:"]',e);
      const H=$('.opw',e).offsetHeight;
      const place=(arr,side)=>arr.forEach((sk,i)=>{
        const y=H/2-(arr.length-1)*7.5+i*15-6.5;
        sk.style.top=y+'px';sk.style[side]='-7px';});
      place(ins,'left');place(outs,'right');
      const li=$$('.opl.in',e),lo=$$('.opl.out',e);
      li.forEach((l,i)=>{l.style.left='8px';l.style.top=(H/2-(ins.length-1)*7.5+i*15-5)+'px';});
      lo.forEach((l,i)=>{l.style.right='8px';l.style.top=(H/2-(outs.length-1)*7.5+i*15-5)+'px';});
    });
    $$('.nd.pill',cv).forEach(e=>{
      const ins=$$('.opsk[data-sk^="in:"]',e),outs=$$('.opsk[data-sk^="out:"]',e);
      const H=$('.pw',e).offsetHeight;
      ins.forEach((sk,i)=>{sk.style.left='-7px';sk.style.top=(H/2-(ins.length-1)*7.5+i*15-6.5)+'px';});
      outs.forEach((sk,i)=>{sk.style.right='-7px';sk.style.top=(H/2-(outs.length-1)*7.5+i*15-6.5)+'px';});
      $$('.opsk-fix',e).forEach(x=>x.remove());
    });
  }
  function sockPos(nm,dir,k){
    const n=g.nodes.find(x=>x.name===nm),o=geo[nm];if(!n||!o||!o[dir][k])return null;
    return {x:n.x+o[dir][k].x,y:n.y+o[dir][k].y};
  }
  function wires(tmp){
    const parts=[];
    g.edges.forEach((e,i)=>{
      const a=sockPos(e.from[0],'out',e.from[1]),b2=sockPos(e.to[0],'in',e.to[1]);if(!a||!b2)return;
      const n=g.nodes.find(x=>x.name===e.from[0]);
      const ty=(nodeOuts(n)||[]).find(o=>o[0]===e.from[1]);
      let col=ty?tyColor(ty[1]):PRIMC.Any;
      if(n&&nodeDef(n).design==='pill')col=PRIMC[varTypeOf(n)]||col;
      const dx=Math.max(30,Math.abs(b2.x-a.x)*.44);
      const dpath=`M${a.x} ${a.y}C${a.x+dx} ${a.y} ${b2.x-dx} ${b2.y} ${b2.x} ${b2.y}`;
      parts.push(`<path d="${dpath}" fill="none" stroke="rgba(0,0,0,.75)" stroke-width="4.6" vector-effect="non-scaling-stroke"/>
        <path d="${dpath}" fill="none" stroke="${col}" stroke-width="2.1" vector-effect="non-scaling-stroke" data-e="${i}"/>`);
    });
    if(tmp)parts.push(`<path d="${tmp.d}" fill="none" stroke="#a8cdff" stroke-width="2.1" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`);
    svg.innerHTML=parts.join('');
    $$('[data-e]',svg).forEach(p=>{p.style.pointerEvents='stroke';p.style.cursor='default';
      p.addEventListener('contextmenu',ev=>{ev.preventDefault();ev.stopPropagation();
        const i=+p.dataset.e;ctxMenu(ev.clientX,ev.clientY,[{id:'d',t:'Disconnect',ic:'trash',
          fn:()=>{commit('disconnect');g.edges.splice(i,1);evaluate();render();}}]);});});
  }
  function minimap(){
    if(!UI.mmOn)return;
    const c=mm.getContext('2d');c.clearRect(0,0,122,80);if(!g.nodes.length)return;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    g.nodes.forEach(n=>{const o=geo[n.name]||{w:140,h:60};
      x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+o.w);y1=Math.max(y1,n.y+o.h);});
    const r=wrap.getBoundingClientRect();
    const vx0=(-V0.x)/V0.z,vy0=(-V0.y)/V0.z,vw=r.width/V0.z,vh=r.height/V0.z;
    x0=Math.min(x0,vx0);y0=Math.min(y0,vy0);x1=Math.max(x1,vx0+vw);y1=Math.max(y1,vy0+vh);
    const pad=24;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
    const sc=Math.min(122/(x1-x0),80/(y1-y0));
    const tx=v=>(v-x0)*sc,ty=v=>(v-y0)*sc;
    c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;
    c.strokeRect(tx(vx0),ty(vy0),vw*sc,vh*sc);
    c.fillStyle='rgba(120,170,255,.09)';c.fillRect(tx(vx0),ty(vy0),vw*sc,vh*sc);
    c.strokeStyle='rgba(150,190,240,.4)';
    g.edges.forEach(e=>{const a=sockPos(e.from[0],'out',e.from[1]),b2=sockPos(e.to[0],'in',e.to[1]);
      if(!a||!b2)return;c.beginPath();c.moveTo(tx(a.x),ty(a.y));c.lineTo(tx(b2.x),ty(b2.y));c.stroke();});
    g.nodes.forEach(n=>{const o=geo[n.name]||{w:140,h:60},d=nodeDef(n);
      c.fillStyle=isSel(n.name)?'#a8cdff':CATS[d.cat].c;
      c.fillRect(tx(n.x),ty(n.y),Math.max(2,o.w*sc),Math.max(2,o.h*sc));});
  }
  function toGraph(e){const r=wrap.getBoundingClientRect();
    return {x:(e.clientX-r.left-V0.x)/V0.z,y:(e.clientY-r.top-V0.y)/V0.z};}
  /* ---------- interaction ---------- */
  wrap.addEventListener('wheel',e=>{e.preventDefault();
    const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    const gx=(mx-V0.x)/V0.z,gy=(my-V0.y)/V0.z;
    V0.z=clamp(V0.z*(e.deltaY<0?1.12:1/1.12),.24,2.6);
    V0.x=mx-gx*V0.z;V0.y=my-gy*V0.z;applyT();minimap();},{passive:false});
  wrap.addEventListener('mousedown',e=>{
    setActivePane('viewport');
    const sk=e.target.closest('[data-sk]');
    if(sk&&e.button===0){e.preventDefault();e.stopPropagation();startWire(sk);return;}
    const nh=e.target.closest('[data-nd]');
    if(nh&&e.button===0){
      const nm=nh.dataset.nd,n=g.nodes.find(x=>x.name===nm);
      if(e.target.closest('input,select'))return;
      if(e.shiftKey||e.ctrlKey||e.metaKey){toggleSel(nm);markSel();renderChrome();return;}
      const now=Date.now();
      if(CLK.nm===nm&&now-CLK.t<430&&!e.target.closest('.sw,.xb,.nd-add')){
        CLK.t=0;e.preventDefault();nodeDoubleClick(g,nm);return;}
      CLK.nm=nm;CLK.t=now;
      if(!isSel(nm)){selectOnly(nm);markSel();renderChrome();syncPropView();renderChrome();}
      if(e.target.closest('.sw,.xb,.nd-add'))return;
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY;
      const start=UI.multi.map(k=>{const q=g.nodes.find(x=>x.name===k);return q?{q,x:q.x,y:q.y}:null;}).filter(Boolean);
      let moved=false;
      const mv=ev=>{const dx=(ev.clientX-sx)/V0.z,dy=(ev.clientY-sy)/V0.z;
        if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;
        if(!moved){moved=true;commit('move node');}
        start.forEach(it=>{it.q.x=Math.round(it.x+dx);it.q.y=Math.round(it.y+dy);
          const e2=$('[data-nd="'+CSS.escape(it.q.name)+'"]',cv);if(e2){e2.style.left=it.q.x+'px';e2.style.top=it.q.y+'px';}});
        wires();minimap();};
      const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};
      addEventListener('mousemove',mv);addEventListener('mouseup',up);return;}
    if(e.button===1||(e.button===0&&KEYS.space)){
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ox=V0.x,oy=V0.y;
      const mv=ev=>{V0.x=ox+(ev.clientX-sx);V0.y=oy+(ev.clientY-sy);applyT();minimap();};
      const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};
      addEventListener('mousemove',mv);addEventListener('mouseup',up);return;}
    if(e.button===0){ /* marquee */
      e.preventDefault();
      const p0=toGraph(e),r0=wrap.getBoundingClientRect();
      const box2=el('div','marq');wrap.appendChild(box2);
      const add=e.shiftKey;if(!add){UI.multi=[];UI.sel={kind:'graph',graph:g.name};markSel();renderChrome();}
      const mv=ev=>{const p1=toGraph(ev);
        const x0=Math.min(p0.x,p1.x),y0=Math.min(p0.y,p1.y),x1=Math.max(p0.x,p1.x),y1=Math.max(p0.y,p1.y);
        box2.style.left=(x0*V0.z+V0.x)+'px';box2.style.top=(y0*V0.z+V0.y)+'px';
        box2.style.width=((x1-x0)*V0.z)+'px';box2.style.height=((y1-y0)*V0.z)+'px';
        const hit=g.nodes.filter(n=>{const o=geo[n.name]||{w:140,h:60};/**/
          return n.x<x1&&n.x+o.w>x0&&n.y<y1&&n.y+o.h>y0;}).map(n=>n.name);
        $$('.nd',cv).forEach(el2=>el2.classList.toggle('sel',hit.includes(el2.dataset.nd)||(add&&UI.multi.includes(el2.dataset.nd))));
        box2.__hit=hit;};
      const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);
        const hit=box2.__hit||[];box2.remove();
        if(hit.length){UI.multi=add?[...new Set(UI.multi.concat(hit))]:hit;
          UI.sel={kind:'node',graph:g.name,node:hit[hit.length-1]};}
        markSel();renderChrome();};
      addEventListener('mousemove',mv);addEventListener('mouseup',up);}
  });
  wrap.addEventListener('dblclick',e=>{
    const nh=e.target.closest('[data-nd]');
    if(nh&&!e.target.closest('input,select'))nodeDoubleClick(g,nh.dataset.nd);
    else if(!nh){const p=toGraph(e);nodePicker(g,p.x,p.y);}
  });
  wrap.addEventListener('contextmenu',e=>{
    if(e.target.closest('[data-e]'))return;
    e.preventDefault();const nh=e.target.closest('[data-nd]');
    if(nh){const nm=nh.dataset.nd;if(!isSel(nm))selectOnly(nm);render();
      const d=nodeDef(g.nodes.find(x=>x.name===nm));
      ctxMenu(e.clientX,e.clientY,[
        {id:'o',t:d.viewer||d.editor?'Open viewer':d.pane?'Show in pane':'Open',ic:'eye',dis:!(d.viewer||d.editor||d.pane),
          fn:()=>nodeDoubleClick(g,nm)},
        {id:'b',t:'Behavior',ic:'gear',dis:!d.behavior,fn:()=>{UI.propView='behavior';showPane('Properties');render();}},
        {id:'u',t:'Duplicate',ic:'plus',fn:()=>duplicateSel(g)},
        {sep:1},
        {id:'d',t:UI.multi.length>1?'Delete '+UI.multi.length+' nodes':'Delete',ic:'trash',fn:()=>deleteSelNodes(g)}]);}
    else{const p=toGraph(e);ctxMenu(e.clientX,e.clientY,[
      {id:'a',t:'Add node…',ic:'plus',fn:()=>nodePicker(g,p.x,p.y)},
      {id:'f',t:'Frame all',ic:'eye',fn:()=>frame()},
      {id:'e',t:'Evaluate',ic:'play',fn:()=>{evaluate();render();}}]);}
  });
  function startWire(sk){
    const [dir,nm,k,ty]=sk.dataset.sk.split(':');
    const a=sockPos(nm,dir,k);if(!a)return;
    if(dir==='in'){const i=g.edges.findIndex(e=>e.to[0]===nm&&e.to[1]===k);
      if(i>=0){commit('disconnect');g.edges.splice(i,1);evaluate();render();return;}}
    const mv=ev=>{const p=toGraph(ev);
      const dx=Math.max(30,Math.abs(p.x-a.x)*.44);
      const d2=dir==='out'?`M${a.x} ${a.y}C${a.x+dx} ${a.y} ${p.x-dx} ${p.y} ${p.x} ${p.y}`
        :`M${p.x} ${p.y}C${p.x+dx} ${p.y} ${a.x-dx} ${a.y} ${a.x} ${a.y}`;
      wires({d:d2});};
    const up=ev=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);
      const el2=document.elementFromPoint(ev.clientX,ev.clientY),t2=el2&&el2.closest('[data-sk]');
      if(t2){const [d2,n2,k2]=t2.dataset.sk.split(':');
        if(d2!==dir&&n2!==nm){
          const from=dir==='out'?[nm,k]:[n2,k2],to=dir==='out'?[n2,k2]:[nm,k];
          commit('connect');
          g.edges=g.edges.filter(e=>!(e.to[0]===to[0]&&e.to[1]===to[1]));
          g.edges.push({from,to});evaluate();render();return;}}
      wires();};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);
  }
  function frame(){
    if(!g.nodes.length)return;
    if(!Object.keys(geo).length)measure();
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    g.nodes.forEach(n=>{const o=geo[n.name]||{w:150,h:70};
      x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+o.w);y1=Math.max(y1,n.y+o.h);});
    const r=wrap.getBoundingClientRect();if(!r.width)return;
    const pad=44;
    V0.z=clamp(Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0)),.24,1.4);
    V0.x=(r.width-(x1-x0)*V0.z)/2-x0*V0.z;V0.y=(r.height-(y1-y0)*V0.z)/2-y0*V0.z;
    applyT();paint();
  }
  wrap.addEventListener('change',e=>{
    const t2=e.target.closest('[data-p]'),nh=e.target.closest('[data-nd]');if(!t2||!nh)return;
    const n=g.nodes.find(x=>x.name===nh.dataset.nd),pk=t2.dataset.p.slice(2);
    const d=nodeDef(n),p=(d.params||[]).find(q=>q.k===pk);
    commit('edit parameter');n.params[pk]=p&&p.t==='num'?num(t2.value):t2.value;evaluate();render();});
  on(wrap,'click','.sw[data-pt]',(e,t2)=>{const nh=e.target.closest('[data-nd]');if(!nh)return;
    const n=g.nodes.find(x=>x.name===nh.dataset.nd),pk=t2.dataset.pt.slice(2);
    commit('edit parameter');n.params[pk]=!n.params[pk];evaluate();render();});
  /* inline list editing, right on the node */
  wrap.addEventListener('change',e=>{const t2=e.target.closest('[data-nit]');if(!t2)return;
    const n=g.nodes.find(x=>x.name===e.target.closest('[data-nd]').dataset.nd);
    commit('edit item');n.items[+t2.dataset.nit]=t2.value;evaluate();render();});
  on(wrap,'click','[data-nitd]',(e,t2)=>{const n=g.nodes.find(x=>x.name===e.target.closest('[data-nd]').dataset.nd);
    commit('remove item');n.items.splice(+t2.dataset.nitd,1);evaluate();render();});
  on(wrap,'click','[data-nitadd]',e=>{const n=g.nodes.find(x=>x.name===e.target.closest('[data-nd]').dataset.nd);
    commit('add item');n.items=n.items||[];n.items.push('0');evaluate();render();});
  on(wrap,'click','[data-skadd]',e=>{const n=g.nodes.find(x=>x.name===e.target.closest('[data-nd]').dataset.nd);
    commit('add socket');addSocket(n);evaluate();render();});
  function markSel(){$$('.nd',cv).forEach(e=>e.classList.toggle('sel',isSel(e.dataset.nd)));minimap();}
  box.__refresh=()=>{paint();applyT();};
  box.__frame=frame;box.__graph=g.name;box.__paint=paint;box.__mark=markSel;
  applyT();paint();

function printDoc(v,name){

  const specs=(v.pages&&v.pages.length)?v.pages:[v.spec];
  let [w,hh]=PAPER[specs[0].paper]||PAPER.Letter;
  if(specs[0].orientation==='Landscape')[w,hh]=[hh,w];
  const pageHtml=s=>s.els.map(e=>{
    const st=e.style||{};const base=`position:absolute;left:${e.x}in;top:${e.y}in;width:${e.w}in;height:${e.h}in;overflow:hidden`;
    if(e.k==='text')return `<div style="${base};font-size:${st.size||11}pt;font-weight:${st.weight||400};text-align:${st.align||'left'};white-space:pre-wrap">${esc(interp(e.text))}</div>`;
    if(e.k==='rule')return `<div style="${base};border-top:1px solid #222"></div>`;
    if(e.k==='box')return `<div style="${base};border:1px solid #bbb"></div>`;
    const val=srcOf(v,e);
    if(e.k==='table'&&(isT(val,'Table')||isT(val,'Grid')||isT(val,'Sheet'))){
      const tb=isT(val,'Table')?val:isT(val,'Grid')?V.table(val.v[0].map((_,i)=>colLabel(i)),val.v.slice(1)):V.table(val.rows[0].map((_,i)=>colLabel(i)),val.rows.slice(1));
      const two=tb.cols.some(c=>c.g);
      const th='border:.5pt solid #999;background:#eee;padding:1pt 3pt;font-weight:500;text-align:center;font-size:7.5pt';
      const td='border:.5pt solid #999;padding:1pt 3pt;text-align:right;font-size:7.5pt';
      let head='';
      if(two){let r1='',r2='',i=0;while(i<tb.cols.length){const c=tb.cols[i];
        if(!c.g){r1+=`<th rowspan="2" style="${th}">${esc(c.n)}</th>`;i++;}
        else{let j=i;while(j<tb.cols.length&&tb.cols[j].g===c.g)j++;
          r1+=`<th colspan="${j-i}" style="${th}">${esc(c.g)}</th>`;
          for(let k=i;k<j;k++)r2+=`<th style="${th}">${esc(tb.cols[k].n)}</th>`;i=j;}}
        head=`<tr>${r1}</tr><tr>${r2}</tr>`;}
      else head=`<tr>${tb.cols.map(c=>`<th style="${th}">${esc(c.n)}</th>`).join('')}</tr>`;
      const F=colFmts(tb);
      return `<div style="${base}"><table style="border-collapse:collapse;width:100%"><thead>${head}</thead><tbody>${
        tb.rows.map(r=>`<tr>${tb.cols.map((c,i)=>`<td style="${td}${i===0?';text-align:left':''}">${esc(F[i](r[i]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
    if(e.k==='chart')return `<div style="${base}">${chartSvg(chartData(isT(val,'Chart')?val.tb:val,e.labels,e.series),e.kind||'Column',e.w*96,e.h*96,false)}</div>`;
    return `<div style="${base}"></div>`;}).join('');
  const w2=window.open('','_blank');
  if(!w2){toast('The browser blocked the print window. Allow pop-ups for this page.');return;}
  w2.document.write(`<!DOCTYPE html><html><head><title>${esc(name)}</title>
    <style>@page{size:${w}in ${hh}in;margin:0}body{margin:0;font-family:Georgia,'Times New Roman',serif;color:#111}
    .page{position:relative;width:${w}in;height:${hh}in;overflow:hidden;page-break-after:always}
    .page:last-child{page-break-after:auto}</style></head>
    <body>${specs.map(sp=>`<div class="page">${pageHtml(sp)}</div>`).join('')}
    <script>setTimeout(function(){window.print();},280);<\/script></body></html>`);
  w2.document.close();
}

function cmdPalette(){
  if(PAL.open)return closePalette();
  const all=palItems();
  const KMAP={};all.forEach(x=>{if(x.id)KMAP[x.id]=x;});
  const wrap=$('#palwrap'),inp=$('#palin'),drop=$('#paldrop');
  PAL.open=true;PAL.sel=0;wrap.classList.add('open');
  $('#modals').classList.add('on');$('#scrim').classList.add('on');$('#spot').classList.add('on');
  $('#scrim').onmousedown=closePalette;
  inp.readOnly=false;inp.value='';inp.placeholder='Type a command or an object name';
  const last=UI.recentCmd[0];
  const lastCmd=last?all.find(x=>x.id===last):null;
  const recent=lastCmd?[Object.assign({},lastCmd,{t:lastCmd.t,s:'Most recent',recent:true})]:[];
  function score(x,q){const t2=(x.t+' '+x.s).toLowerCase(),n2=q.toLowerCase();
    if(!n2)return 1;if(t2.startsWith(n2))return 3;if(t2.includes(n2))return 2;
    let i=0;for(const ch of n2){i=t2.indexOf(ch,i);if(i<0)return 0;i++;}return 1;}
  function paint(){
    const q=inp.value;
    const hits=all.map(x=>[score(x,q),x]).filter(p=>p[0]>0).sort((a2,b2)=>b2[0]-a2[0]).slice(0,80).map(p=>p[1]);
    PAL.items=(q?[]:recent).concat(hits);
    PAL.sel=clamp(PAL.sel,0,Math.max(0,PAL.items.length-1));
    let html='';
    PAL.items.forEach((x,i)=>{
      html+=`<div class="it${i===PAL.sel?' on':''}" data-i="${i}">${ico(x.ic||'dot',14)}
        <span>${esc(x.t)}</span><span class="k">${esc(x.k||(x.s==='Command'?'':x.s))}</span></div>`;
      if(x.recent)html+='<div class="sep"></div>';});
    drop.innerHTML=html||'<div class="empty">No matches.</div>';
    const onEl=$('.it.on',drop);if(onEl)onEl.scrollIntoView({block:'nearest'});
  }
  inp.oninput=()=>{PAL.sel=0;paint();};
  inp.onkeydown=e=>{
    e.stopPropagation();
    if(e.key==='ArrowDown'){e.preventDefault();PAL.sel++;paint();}
    else if(e.key==='ArrowUp'){e.preventDefault();PAL.sel--;paint();}
    else if(e.key==='Enter'){const x=PAL.items[PAL.sel];closePalette();if(x&&x.fn)setTimeout(x.fn,20);}
    else if(e.key==='Escape'){e.preventDefault();closePalette();}
  };
  on(drop,'click','[data-i]',(e,t2)=>{const x=PAL.items[+t2.dataset.i];closePalette();if(x&&x.fn)setTimeout(x.fn,20);});
  paint();setTimeout(()=>inp.focus(),30);
}
function closePalette(){
  if(!PAL.open)return;PAL.open=false;
  const wrap=$('#palwrap'),inp=$('#palin');
  wrap.classList.remove('open');inp.readOnly=true;inp.value='';
  inp.placeholder='Search commands and objects';inp.blur();
  $('#scrim').classList.remove('on');$('#spot').classList.remove('on');
  setTimeout(()=>{if(!MODAL&&!PAL.open)$('#modals').classList.remove('on');},220);
}

      navRows('#zB .fxr, #zL .fxr, #zR .fxr, .ed.on .fxr',e.key==='ArrowDown'?1:-1,r=>{

        const again=$$('.fxr').find(x=>(x.dataset.conn||x.dataset.out||x.dataset.surf)===keep);
        if(again)again.classList.add('cur');});

  if(p==='viewport'){
    const t=actTab();
    if(t&&t.kind==='graph'&&/^Arrow/.test(e.key)){

      const d=e.shiftKey?1:10;

      const dy=e.key==='ArrowDown'?d:e.key==='ArrowUp'?-d:0;
      if(UI.multi.length){commit('Move node');
        UI.multi.forEach(nm=>{const n=g.nodes.find(x=>x.name===nm);if(n){n.x+=dx;n.y+=dy;}});
        const ed=EDC[UI.act];if(ed&&ed.__paint)ed.__paint();}
      else{const V0=GVIEW[t.graph];if(V0){V0.x-=dx*3;V0.y-=dy*3;const ed=EDC[UI.act];if(ed&&ed.__refresh)ed.__refresh();}}
      return true;}
    if(t&&(t.kind==='viewer'||t.kind==='output'||t.kind==='conn')&&/^Arrow/.test(e.key)){
      const sc=$('.ed.on .vscroll');if(sc){e.preventDefault();

          top:e.key==='ArrowDown'?40:e.key==='ArrowUp'?-40:0});return true;}}
    if(t&&t.kind==='surf'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();
      ribAct(e.key==='ArrowRight'?'pagenext':'pageprev');return true;}

}

function sheetEval(data){
  const raw=(data||[]).map(r=>r.map(c=>c==null?'':String(c)));
  const val=raw.map(r=>r.map(c=>{const f=parseFloat(c);return c!==''&&!isNaN(f)&&/^-?[\d.]+$/.test(c.trim())?f:c;}));
  const scope={};
  const put=()=>{val.forEach((r,i)=>r.forEach((c,j)=>{scope[colLabel(j)+(i+1)]=c;}));
    FILE.globals.forEach(v=>scope[v.name]=varValue(v));};
  for(let pass=0;pass<3;pass++){
    put();let changed=false;
    raw.forEach((r,i)=>r.forEach((c,j)=>{
      if(c.startsWith('=')){
        let v;try{v=evalExpr(c.slice(1),scope,null);}catch(err){v='#ERR';}
        if(val[i][j]!==v){val[i][j]=v;changed=true;}}}));
    if(!changed)break;
  }
  return val;
}

    x0=Math.min(x0,vx0);y0=Math.min(y0,vy0);x1=Math.max(x1,vx0+vw);y1=Math.max(y1,vy0+vh);

/* v16: a gallery graph holding one of every node                         */
/* ==================================================================== */
function buildGallery(){
  const g={name:'NodeGallery',auto:false,locals:[],nodes:[],edges:[]};
  const order=['Input','Output','Table','Make','Convert','Combine','Util','Math'];
  const groups={};
  NLIST.forEach(d=>{const k=d.cat+(d.sub?' · '+d.sub:'');(groups[k]=groups[k]||[]).push(d);});
  const keys=Object.keys(groups).sort((a,b)=>{
    const ca=order.indexOf(a.split(' · ')[0]),cb=order.indexOf(b.split(' · ')[0]);
    return ca-cb||a.localeCompare(b);});
  let x=40,y=40,colW=0;
  keys.forEach(k=>{
    const list=groups[k];
    const note=newNode(g,'Node.Util.Comment',x,y);
    note.params.text=k.toUpperCase()+'  ('+list.length+')';
    note.label=k;
    y+=54;
    list.forEach(d=>{
      const n=newNode(g,d.cls,x,y);
      const wide=(d.design==='full')?200:d.design==='pill'?120:110;
      colW=Math.max(colW,wide);
      y+=(d.design==='full'?(24+(visParams(d).length*19)+((d.ins||[]).length+(d.outs||[]).length)*15+26):46);
    });
    y+=40;
    if(y>2600){x+=colW+70;y=40;colW=0;}
  });
  return g;
}
